name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  back-end:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mercadinho
          POSTGRES_USER: mercadinho
          POSTGRES_PASSWORD: senha-so-do-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: chave-so-do-ci
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      SQL_ENGINE: django.db.backends.postgresql
      SQL_DATABASE: mercadinho
      SQL_USER: mercadinho
      SQL_PASSWORD: senha-so-do-ci
      SQL_HOST: localhost
      SQL_PORT: "5432"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  front-end:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build